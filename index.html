<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Le cours Data Engineering & Cloud réexpliqué simplement : 10 leçons, quiz, mode oral, 7 langues.">
<title>Data Eng sans prise de tête</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a pipeline you walk along — left rail of stations (lessons), one station per screen, highlighter marks for the words that matter */
:root{
  --paper:#f3f5f8; --card:#ffffff; --ink:#14202e; --muted:#566476; --line:#d6dde6;
  --mark:#ffe066; --accent:#1f5fbf; --accent-soft:#e3ecfa;
  --good:#1d7a4a; --good-soft:#dff3e7; --bad:#b3322a; --bad-soft:#fbe3e1;
  --bronze:#a8662d; --silver:#7a8796; --gold:#c49a12;
  --f-display:"Bricolage Grotesque", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", "Noto Sans Arabic", "Segoe UI Arabic", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", "Noto Sans Arabic", "Segoe UI Arabic", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1620; --card:#17212d; --ink:#e7edf4; --muted:#9aa8b8; --line:#2a3746;
  --mark:#6b5a12; --accent:#7fb0ff; --accent-soft:#1c2c45;
  --good:#5fd39a; --good-soft:#143224; --bad:#ff8a80; --bad-soft:#3a1a18;
  --bronze:#e09a5c; --silver:#b4c0cd; --gold:#f0c84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1620; --card:#17212d; --ink:#e7edf4; --muted:#9aa8b8; --line:#2a3746;
  --mark:#6b5a12; --accent:#7fb0ff; --accent-soft:#1c2c45;
  --good:#5fd39a; --good-soft:#143224; --bad:#ff8a80; --bad-soft:#3a1a18;
  --bronze:#e09a5c; --silver:#b4c0cd; --gold:#f0c84a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.6}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
nav.rail{position:sticky;top:0;height:100vh;overflow:auto;border-inline-end:1px solid var(--line);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;margin:0 0 4px}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}
.prog{margin:12px 0 16px;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.rail a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px}
.rail a:hover{background:var(--accent-soft)}
.rail a[aria-current="page"]{background:var(--accent-soft);font-weight:700}
.rail a .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:22px}
.rail a .ok{margin-inline-start:auto;color:var(--good);font-size:13px}
.rail .sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
main{padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.mobilenav{display:none}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(30px,5vw,44px);font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
p{margin:0}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:2px}
code,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.lede{font-size:21px;line-height:1.45}
.block{display:flex;flex-direction:column;gap:12px}
.image{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px}
.image .tag{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.term{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.term b{font-family:var(--f-mono);font-size:14px;color:var(--accent)}
.term span{font-size:15px}
.trap{border-inline-start:4px solid var(--bad);background:var(--bad-soft);padding:14px 16px;border-radius:8px}
.trap b{color:var(--bad)}
.mine{border:1px dashed var(--good);background:var(--good-soft);border-radius:8px;padding:14px 16px}
.mine b{color:var(--good)}
.phrase{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.3;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:14px 0}
.phrase small{display:block;font-family:var(--f-mono);font-size:13px;font-weight:400;color:var(--muted);margin-top:6px}
ul.clean{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
details.qa{background:var(--card);border:1px solid var(--line);border-radius:8px}
details.qa summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none}
details.qa summary::before{content:"▸ ";color:var(--accent)}
[dir="rtl"] details.qa summary::before{content:"◂ "}
details.qa[open] summary::before{content:"▾ "}
details.qa div{padding:0 16px 14px}
.quiz{display:flex;flex-direction:column;gap:18px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .opts{display:flex;flex-direction:column;gap:8px}
.q button.opt{text-align:start;font:inherit;font-size:16px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.q button.opt:hover:not(:disabled){border-color:var(--accent)}
.q button.opt.right{background:var(--good-soft);border-color:var(--good)}
.q button.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.q button.opt:disabled{cursor:default}
.q .why{font-size:15px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--card)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:focus-visible,.opt:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.score{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
/* simple block, translation bar, language */
.simple{border:2px solid var(--ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--card)}
.simple-tag{align-self:flex-start;background:var(--mark);font-family:var(--f-display);font-weight:800;font-size:15px;padding:3px 10px;border-radius:4px}
.sgrid{display:grid;grid-template-columns:1fr;gap:14px}
.sbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.sbox h3{font-size:16px;color:var(--accent)}
.sbox.ex{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
ol.steps{margin:0;padding-inline-start:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;font-size:14px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center}
.trbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:15px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.sm{padding:6px 12px;font-size:14px}
.muted{color:var(--muted);font-size:15px}
.g{color:var(--good)}.r{color:var(--bad)}
.tip{border-inline-start:4px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:8px}
.tip b{color:var(--accent)}
.spread{justify-content:space-between}.self-start{align-self:flex-start}.tight{gap:8px}
.langbox{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.langbox label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
select.langsel,.mobilenav select{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
/* home */
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,6vw,54px);line-height:1.02}
.hero .lede{max-width:34em}
.strata{display:flex;height:10px;border-radius:5px;overflow:hidden;max-width:360px}
.strata i{flex:1}.strata i:nth-child(1){background:var(--bronze)}.strata i:nth-child(2){background:var(--silver)}.strata i:nth-child(3){background:var(--gold)}
.resume{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:16px 18px}
.resume .big{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.2}
.resume .small{font-size:14px;color:var(--muted)}
.resume>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.ring{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--ink);text-decoration:none;min-width:0}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .ic{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tile b{font-family:var(--f-display);font-size:19px;font-weight:800;line-height:1.2}
.tile span.d{font-size:14px;color:var(--muted);line-height:1.4}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.lc{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--ink);text-decoration:none;min-width:0}
.lc:hover{border-color:var(--accent)}
.lc .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lc b{font-size:15px;line-height:1.3}
.chip{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-top:4px}
.chip.ok{background:var(--good-soft);color:var(--good)}.chip.todo{background:var(--paper);color:var(--muted);border:1px solid var(--line)}.chip.mid{background:var(--accent-soft);color:var(--accent)}
.tile{transition:transform .15s,border-color .15s}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:13px;color:var(--muted)}
.grid-l td,.grid-l th{white-space:nowrap}
.grid-l td.ln{white-space:normal;min-width:170px}
.grid-l a{color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--good)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lnk{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink);text-decoration:none;min-width:0}
.lnk:hover{border-color:var(--accent)}
.lnk b{font-size:15px}.lnk span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.cmd{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.cmd .what{font-size:14px;min-width:150px;flex:0 0 34%}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:transparent;padding:0}
.cmd button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 8px;cursor:pointer}
@media (max-width:600px){.cmd{flex-wrap:wrap}.cmd .what{flex-basis:100%}}
/* map */
.pipe{display:flex;flex-direction:column;gap:10px}
.lane{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stop{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);text-decoration:none;min-width:0}
.stop:hover{border-color:var(--accent)}
.stop .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.stop .t{font-family:var(--f-display);font-weight:800;font-size:17px}
.stop .d{font-size:13px;color:var(--muted);line-height:1.35}
.stop.bz{border-top:4px solid var(--bronze)} .stop.sv{border-top:4px solid var(--silver)} .stop.gd{border-top:4px solid var(--gold)}
.arrow{text-align:center;color:var(--muted);font-family:var(--f-mono);font-size:13px}
.around{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.around .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* oral */
.card-oral{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;min-height:260px}
.card-oral .from{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.card-oral .qq{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.3}
.card-oral .ans{border-top:1px solid var(--line);padding-top:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
.tscroll{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:start;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}
.done-toggle{align-self:flex-start}
.vch{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vc{display:flex;gap:10px;align-items:baseline;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.vc:hover{border-color:var(--accent)}
.vt{font-family:var(--f-mono);font-size:13px;color:var(--accent);flex:none}
.lex{display:flex;flex-direction:column;gap:0}
.lex input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;margin-bottom:12px}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  nav.rail{display:none}
  .mobilenav{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
  .mobilenav select{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Navigation">
    <p class="brand">Data Eng<br>sans prise de tête<small id="brandsub"></small></p>
    <div class="langbox"><label class="langlbl" for="lang1"></label><select class="langsel" id="lang1"></select></div>
    <div class="prog"><span id="progtxt"></span><div class="bar"><i id="progbar"></i></div></div>
    <div id="raillinks"></div>
  </nav>
  <main>
    <div class="page">
      <div class="mobilenav">
        <p class="brand">Data Eng sans prise de tête</p>
        <label class="eyebrow langlbl" for="lang2"></label><select class="langsel" id="lang2"></select>
        <label class="eyebrow" id="goto" for="msel"></label><select id="msel"></select>
      </div>
      <div id="view" class="page"></div>
    </div>
  </main>
</div>
<script src="lang/fr.js"></script>
<script src="js/main.js"></script>
</body>
</html>
